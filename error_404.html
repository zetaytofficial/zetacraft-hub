<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetaCraft Hub - Pagina Non Trovata (404)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        glass: {
                            bg: 'rgba(15, 23, 42, 0.45)',
                            border: 'rgba(255, 255, 255, 0.18)',
                            shine: 'rgba(255, 255, 255, 0.35)',
                        },
                        azure: {
                            400: '#38bdf8',
                            500: '#0ea5e9',
                            600: '#0284c7',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Effetti orbi fluidi e animazioni dello sfondo */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.75;
            animation: float 18s infinite ease-in-out alternate;
            will-change: transform;
        }

        .blob-1 {
            top: 10%;
            left: 15%;
            width: 420px;
            height: 420px;
            background: radial-gradient(circle, #00f2fe 0%, #4facfe 100%);
            animation-duration: 16s;
        }

        .blob-2 {
            bottom: 15%;
            right: 15%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, #0052d4 0%, #4364f7 50%, #6fb1fc 100%);
            animation-duration: 22s;
            animation-delay: -5s;
        }

        .blob-3 {
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, #0284c7 0%, #1e40af 100%);
            animation-duration: 19s;
            animation-delay: -9s;
        }

        @keyframes float {
            0% {
                transform: translate(0px, 0px) scale(1) rotate(0deg);
            }
            33% {
                transform: translate(60px, -80px) scale(1.15) rotate(120deg);
            }
            66% {
                transform: translate(-40px, 50px) scale(0.88) rotate(240deg);
            }
            100% {
                transform: translate(0px, 0px) scale(1) rotate(360deg);
            }
        }

        /* Card Liquid Glassmorphism con riflesso speculare */
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 
                0 30px 60px -12px rgba(0, 0, 0, 0.5),
                0 18px 36px -18px rgba(0, 198, 255, 0.3),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.35),
                inset 0 -1px 0 0 rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease;
        }

        .liquid-glass:hover {
            box-shadow: 
                0 35px 70px -15px rgba(0, 0, 0, 0.6),
                0 25px 50px -10px rgba(56, 189, 248, 0.4),
                inset 0 1px 0 0 rgba(255, 255, 255, 0.5);
        }

        /* Riflesso dinamico interattivo al passaggio del mouse */
        .liquid-glass::before {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.22),
                transparent
            );
            transform: skewX(-25deg);
            transition: left 0.8s ease;
            pointer-events: none;
        }

        .liquid-glass:hover::before {
            left: 150%;
        }

        /* Badge/Button Liquid style */
        .liquid-btn {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.25) 0%, rgba(2, 132, 199, 0.4) 100%);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 20px rgba(2, 132, 199, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.4);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .liquid-btn:hover {
            background: linear-gradient(135deg, rgba(56, 189, 248, 0.45) 0%, rgba(2, 132, 199, 0.6) 100%);
            border-color: rgba(255, 255, 255, 0.45);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(56, 189, 248, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.6);
        }

        .liquid-btn:active {
            transform: translateY(1px);
        }

        /* Effetto di pulsazione per le spie di stato */
        .glow-pulse {
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% {
                filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.8));
                opacity: 1;
            }
            50% {
                filter: drop-shadow(0 0 35px rgba(56, 189, 248, 1));
                opacity: 0.85;
            }
        }

        /* Trattamento del testo brillante */
        .text-glow {
            text-shadow: 0 0 25px rgba(56, 189, 248, 0.6);
        }

        /* Griglia overlay futuristica soffice */
        .bg-grid {
            background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between relative bg-slate-950 text-white selection:bg-sky-500 selection:text-white">

    <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="absolute inset-0 bg-grid opacity-60"></div>
    </div>

    <header class="relative z-10 w-full px-6 py-6 lg:px-12">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-3.5 group">
                <!-- Contenitore dell'immagine con effetto lucido -->
                <div class="relative p-2.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 shadow-lg group-hover:border-sky-400/50 transition-all duration-300">
                    <img 
                        src="logo_app.png" 
                        alt="ZetaCraft Hub Logo" 
                        class="w-8 h-8 md:w-9 md:h-9 object-contain filter drop-shadow-[0_0_8px_rgba(56,189,248,0.6)] group-hover:scale-110 transition-transform duration-300"
                        onerror="this.onerror=null; this.src='https://placehold.co/100x100/0ea5e9/ffffff?text=ZCH';"
                    >
                </div>
                <!-- Scritta ZetaCraft Hub -->
                <div class="flex flex-col">
                    <span class="text-xl md:text-2xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white via-sky-100 to-sky-300 group-hover:to-cyan-400 transition-all">
                        ZetaCraft <span class="text-sky-400">Hub</span>
                    </span>
                    <span class="text-[10px] uppercase tracking-widest text-sky-200/60 font-semibold">Official Network</span>
                </div>
            </a>

            <!-- Badge di stato per Errore 404 -->
            <div class="hidden sm:flex items-center gap-2 px-3.5 py-1.5 rounded-full bg-sky-950/40 border border-sky-500/30 backdrop-blur-md">
                <span class="w-2 h-2 rounded-full bg-sky-400 animate-ping"></span>
                <span class="text-xs font-medium text-sky-200">Errore 404</span>
            </div>
        </div>
    </header>

    <main class="relative z-10 flex-1 flex items-center justify-center px-4 py-12">
        <div id="tiltCard" class="w-full max-w-2xl liquid-glass rounded-3xl p-8 sm:p-12 md:p-14 text-center">
            
            <!-- Icona / Big Badge 404 -->
            <div class="mb-6 relative inline-flex justify-center items-center">
                <div class="absolute inset-0 rounded-full bg-sky-500/20 blur-xl animate-pulse"></div>
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-3xl bg-gradient-to-br from-sky-400/20 to-blue-600/20 border border-sky-300/30 flex items-center justify-center backdrop-blur-md shadow-inner glow-pulse">
                    <span class="text-4xl sm:text-5xl font-black text-sky-300 text-glow tracking-tighter">404</span>
                </div>
            </div>

            <!-- Titolo Principale 404 -->
            <h1 class="text-3xl sm:text-4xl md:text-5xl font-black tracking-tight text-white mb-3 leading-tight uppercase text-glow">
                PAGINA NON TROVATA
            </h1>

            <!-- Sottotitolo -->
            <p class="text-base sm:text-lg font-semibold text-sky-200/90 mb-6 tracking-wide uppercase">
                OPS! SEMBRA CHE TU TI SIA PERSO
            </p>

            <p class="text-sm sm:text-base text-slate-300/80 max-w-md mx-auto mb-10 leading-relaxed font-light">
                La pagina che stai cercando non esiste, è stata rimossa o momentaneamente spostata ad un altro indirizzo.
            </p>

            <!-- Pulsanti di Navigazione in Vetro Liquido -->
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="index.html" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl liquid-btn text-white font-semibold flex items-center justify-center gap-3 group">
                    <i class="fa-solid fa-house text-sky-300 group-hover:-translate-x-1 transition-transform duration-300"></i>
                    <span>Torna alla Home</span>
                </a>

                <a href="https://discord.gg/YJp2vkaK34" target="_blank" rel="noopener noreferrer" class="w-full sm:w-auto px-8 py-3.5 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 text-sky-100 font-semibold transition-all duration-300 flex items-center justify-center gap-3 backdrop-blur-md">
                    <i class="fa-brands fa-discord text-sky-400 text-lg"></i>
                    <span>Server Discord</span>
                </a>
            </div>

        </div>
    </main>

    <script>
        // Effetto di movimento 3D al mouse della Card Glassmorphism
        const card = document.getElementById('tiltCard');
        
        if (window.innerWidth > 768 && card) {
            document.addEventListener('mousemove', (e) => {
                const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
                const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
                card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
            });

            // Resetta la rotazione quando il mouse esce dal viewport
            document.addEventListener('mouseleave', () => {
                card.style.transform = 'rotateY(0deg) rotateX(0deg)';
                card.style.transition = 'transform 0.5s ease';
            });

            document.addEventListener('mouseenter', () => {
                card.style.transition = 'none';
            });
        }
    </script>
</body>
</html>
