<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZetaCraft Hub Mining Clicker</title>
    <link rel="stylesheet" href="style-app.css">
    <style>
        body {
            background: transparent;
            color: #fff;
            font-family: sans-serif;
            text-align: center;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        h2 { color: #00d4ff; font-size: 16px; margin-bottom: 5px; }
        p { font-size: 12px; color: #aaa; margin-bottom: 15px; }
        .score { font-size: 14px; font-weight: bold; color: #00ff88; margin-bottom: 15px; }
        .mine-btn {
            background: linear-gradient(135deg, rgba(0, 200, 83, 0.25) 0%, rgba(178, 255, 89, 0.35) 100%);
            backdrop-filter: blur(20px) saturate(200%);
            -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 1px solid rgba(178, 255, 89, 0.5);
            width: 110px;
            height: 110px;
            border-radius: 24px;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(0, 200, 83, 0.25), inset 0 1px 1px rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 45px;
            transition: transform 0.1s ease, box-shadow 0.2s ease;
            outline: none; /* Rimuove il bordo di focus predefinito */
        }
        .mine-btn:active {
            transform: scale(0.9);
            box-shadow: 0 4px 12px rgba(0, 200, 83, 0.2);
        }
    </style>
</head>
<body>
    <h2>⛏️ MINING CLICKER</h2>
    <p>Clicca sul blocco per estrarre risorse!</p>
    <div class="score">💎 Diamanti estratti: <span id="diamond-count">0</span></div>
    
    <!-- Aggiunto event.preventDefault() e .blur() per bloccare il bug dell'invio -->
    <button class="mine-btn" id="click-block" onclick="mineDiamond(event)">💎</button>

    <script>
        let diamonds = localStorage.getItem('zetacraft_diamonds') ? parseInt(localStorage.getItem('zetacraft_diamonds')) : 0;
        document.getElementById('diamond-count').innerText = diamonds;

        function mineDiamond(event) {
            // Se l'evento è generato da tastiera (es. Invio o Spazio tenuti premuti), blocchiamo la ripetizione automatica
            if (event && event.detail === 0) {
                return; 
            }

            diamonds++;
            document.getElementById('diamond-count').innerText = diamonds;
            localStorage.setItem('zetacraft_diamonds', diamonds);

            // Rimuove immediatamente il focus dal bottone impedendo il blocco con Invio
            const btn = document.getElementById('click-block');
            if (btn) btn.blur();
        }
    </script>
</body>
</html>
